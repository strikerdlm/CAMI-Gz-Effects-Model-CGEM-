[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgem-ext"
version = "0.1.0"
description = "ML extension layer (surrogate, OOD detection, sensitivity, API) over the FAA CAMI G-Effects Model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Diego Malpica", email = "dlmalpica@yahoo.com" },
]
keywords = ["aerospace medicine", "G-LOC", "physiology", "machine learning", "surrogate modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0",
    "optuna>=3.5",
    "shap>=0.44",
    "SALib>=1.5",
    "mlflow>=2.10",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "structlog>=24.0",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-requests",
    "pandas-stubs",
    "httpx>=0.27",
]
all = ["cgem-ext[ml,api,dev]"]

[project.urls]
Homepage = "https://github.com/strikerdlm/CAMI-Gz-Effects-Model-CGEM-"
Changelog = "https://github.com/strikerdlm/CAMI-Gz-Effects-Model-CGEM-/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["cgem_ext*"]
exclude = ["tests*", "legacy*", "frontend*", "docs*", "tools*", "notebooks*", "Aerobatics_sample_inputs*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "frontend", "node_modules", "src", "tmp_run*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter
allowed-confusables = ["×", "−", "α", "–", "ρ", "δ", "≥", "≤", "≈"]  # scientific symbols intentionally used in docstrings and comments

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["legacy/", "frontend/", "src/", "tmp_run.*"]

[[tool.mypy.overrides]]
module = ["cgem_wrapper", "aerobatic_profiles", "maneuvers_catalog"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["SALib.*", "sklearn.*", "xgboost.*", "shap.*", "optuna.*", "mlflow.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "needs_cgem_binary: marks tests that require the compiled CGEM binary",
]
